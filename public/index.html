<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dono da Cidade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 120%22%3E%3Ccircle cx=%2260%22 cy=%2260%22 r=%2252%22 fill=%22%2308090b%22 stroke=%22%23d9a943%22 stroke-width=%228%22/%3E%3Cpath d=%22M28 82V62h8v-8h6v28h4V44h10v-8h4v8h10v38h4V56h8v10h8v16z%22 fill=%22%23e8c46a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<script src="vendor/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: jogo de rua noturno, premium, tenso
   IDEA: o mapa real da cidade visto de noite, pintado com a cor de quem manda
   PICTURE: Rio de Janeiro bairro por bairro, e a província de Palermo para a máfia
   COLOUR and TYPE: preto asfalto, dourado de ouro velho como acento, cor da facção no mapa; Anton + Barlow
   LAYOUT: mapa em tela cheia, HUD de vidro no topo, painel de comando à direita (embaixo no celular) */
:root{color-scheme:dark;--bg:#08090b;--p1:rgba(16,17,21,.93);--p2:#1a1c22;--p3:#23262e;--ln:rgba(255,255,255,.09);--ink:#f1ece2;--mu:#9c9aa0;
--g1:#f7dc8e;--g2:#d6a645;--gold:linear-gradient(180deg,#f8e09a 0%,#d9a943 52%,#a8761f 100%);--ok:#7fdc95;--bad:#ff6b5e;
--cond:'Barlow Condensed',Barlow,sans-serif;--disp:Anton,Impact,'Arial Narrow',sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.02;margin:0;letter-spacing:.01em}
.hide{display:none!important}
.gold{background:var(--gold);color:#1d1406;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:12px;box-shadow:0 6px 24px rgba(214,166,69,.22),inset 0 1px 0 rgba(255,255,255,.5)}
.gold:hover:not(:disabled){filter:brightness(1.08)}
.ghost{background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:12px;font-weight:600}
.ghost:hover:not(:disabled){border-color:rgba(247,220,142,.45)}
.btn{min-height:44px;padding:10px 16px}
button:disabled{opacity:.38;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:rgba(255,255,255,.04);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--mu);white-space:nowrap}

/* ===== MENU ===== */
#menu{position:relative;min-height:100vh;overflow:hidden}
#menuMap{position:absolute;inset:0;width:100%;height:100%}
#menu:before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 72% 30%,rgba(8,9,11,.15),rgba(8,9,11,.88) 70%),linear-gradient(90deg,rgba(8,9,11,.8),rgba(8,9,11,.15) 60%,rgba(8,9,11,.55))}
.mgrid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:32px;max-width:1240px;margin:0 auto;padding:clamp(24px,4vw,56px) max(4vw,16px);align-items:start}
.cards{display:grid;gap:14px}
.card{position:relative;border:1px solid var(--ln);border-radius:18px;padding:20px 22px;background:linear-gradient(135deg,rgba(20,22,27,.93),rgba(12,13,16,.9));overflow:hidden}
.card:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,var(--mc),transparent 55%);opacity:.2;pointer-events:none}
.card>*{position:relative;z-index:1}
.card .top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.card .top .chip:first-child{color:#1d1406;background:var(--gold);border:0;font-weight:700}
.card h2{font-size:clamp(44px,6vw,64px);line-height:1.12;text-transform:uppercase;color:var(--mc)}
.card p{color:var(--mu);margin:6px 0 10px;max-width:520px}
.feats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.card .row{display:flex;gap:10px;flex-wrap:wrap}
.card .row .gold{flex:1 1 200px;font-size:18px}
.soon{opacity:.55}.soon h2{font-size:40px}
.side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:8px;position:sticky;top:24px}
.emb{width:120px;height:120px}
.logo{font-family:var(--disp);font-size:clamp(54px,7vw,84px);line-height:.88;text-transform:uppercase;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(214,166,69,.25))}
.slogan{color:var(--mu);max-width:380px;margin:0}
.conts{display:grid;gap:10px;width:min(380px,100%)}
.conts button{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:18px}
.conts small{font-family:Barlow,sans-serif;font-weight:600;letter-spacing:0;text-transform:none;opacity:.8;font-size:14px}
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.credit{font-size:13px;color:var(--mu);max-width:380px}

/* ===== JOGO ===== */
#game{position:fixed;inset:0;overflow:hidden;background:#050a0f}
#map{position:absolute;inset:0}
.maplibregl-ctrl-bottom-left{left:62px}
.maplibregl-ctrl-attrib{background:rgba(8,9,11,.75)!important;color:#9c9aa0}
.maplibregl-ctrl-attrib a{color:#c9c4ba!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px 4px;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,rgba(8,9,11,.97),rgba(8,9,11,.85));border-bottom:1px solid var(--ln);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;padding-right:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--disp);font-weight:400;font-size:20px;line-height:1;display:block;color:var(--pc)}
.brand small{color:var(--mu);font-size:13px}
.stats{display:flex;align-items:center}.stats>.stat{flex:none}
.stat{display:flex;flex-direction:column;line-height:1.1;padding:2px 10px;border-left:1px solid var(--ln)}
.stat small{color:var(--mu);font-size:12.5px;white-space:nowrap}
.stat strong{font-family:var(--cond);font-size:19px;font-weight:700;white-space:nowrap}
.stat em{font-style:normal;font-size:14px;font-weight:600}
.bar{width:84px;height:7px;background:var(--p3);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}
.dots{display:flex;gap:4px;margin-top:5px}.dots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--g2)}.dots i.on{background:var(--g1);border-color:var(--g1)}
.hbtn{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;margin-left:6px}
.hbtn svg{width:20px;height:20px}
.zoom{position:absolute;left:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:4;display:grid;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;background:var(--p1);border:1px solid var(--ln);font-size:22px;font-weight:600;display:grid;place-items:center}
.panel{position:absolute;z-index:6;right:12px;top:78px;bottom:12px;width:360px;display:flex;flex-direction:column;background:var(--p1);border:1px solid var(--ln);border-radius:18px;backdrop-filter:blur(10px);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.tabs{display:flex;border-bottom:1px solid var(--ln);flex:none}
.tabs button{flex:1;min-height:46px;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);border-bottom:2px solid transparent}
.tabs button.on{color:var(--g1);border-bottom-color:var(--g2)}
.pbody{flex:1;overflow:auto;padding:16px;overscroll-behavior:contain}
.pfoot{flex:none;padding:12px;border-top:1px solid var(--ln)}
.pfoot .gold{width:100%;min-height:52px;font-size:20px}
.pbody h2{font-size:30px}
.sub{color:var(--mu);font-size:14px;margin:4px 0 12px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.own{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.own i{width:10px;height:10px;border-radius:3px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.kv div{background:var(--p2);border-radius:12px;padding:8px 10px}
.kv small{display:block;color:var(--mu);font-size:12.5px}
.kv strong{font-family:var(--cond);font-size:20px;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row>button{flex:1 1 110px}
.act{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;margin-bottom:8px}
.act em{font-style:normal;font-size:14px;opacity:.75;white-space:nowrap}
.atk{background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:14px}
.atk input{width:100%;accent-color:var(--g2);height:34px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin:6px 0 10px}
.vs b{font-family:var(--cond);font-size:28px;display:block;line-height:1}
.vs small{color:var(--mu);font-size:12.5px}
.vs span{font-family:var(--disp);color:var(--mu);font-size:20px}
.odds{font-weight:700}
h4{font-family:var(--cond);text-transform:uppercase;letter-spacing:.05em;font-size:15px;color:var(--g1);margin:18px 0 10px}
.pbody>h4:first-child{margin-top:0}
.tgt{display:grid;gap:6px}
.tgt button{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:10px 12px;min-height:44px}
.tgt span{font-size:14px;white-space:nowrap;font-weight:600}
.legend{display:grid;gap:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:15px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend span{margin-left:auto;color:var(--mu);font-size:14px;white-space:nowrap}
.legend .dead{opacity:.4;text-decoration:line-through}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14.5px}
.log li{color:var(--mu);padding-left:12px;border-left:2px solid var(--p3)}
.log li b{color:var(--ink);font-weight:600}
.log li.good{border-color:var(--ok)}.log li.bad{border-color:var(--bad)}
.note{color:var(--mu);font-size:14px}
#res{position:fixed;left:50%;top:96px;transform:translate(-50%,-14px);opacity:0;z-index:20;transition:.25s;pointer-events:none;background:rgba(12,13,16,.96);border:1px solid var(--ln);border-radius:16px;padding:14px 22px;text-align:center;min-width:240px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#res.on{opacity:1;transform:translate(-50%,0)}
#res h3{font-size:30px;text-transform:uppercase}
#res p{margin:2px 0 0;color:var(--mu);font-size:15px}
#dlg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
#dlg .box{width:min(480px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#17181d,#0f1013);border:1px solid rgba(247,220,142,.22);border-radius:20px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
#dlg h2{font-size:36px;margin-bottom:6px}
.rep{list-style:none;margin:12px 0 18px;padding:0;display:grid;gap:8px}
.rep li{display:flex;justify-content:space-between;gap:12px;background:var(--p2);border-radius:10px;padding:9px 12px;font-size:15px}
.rep li b{white-space:nowrap}
.rep.txt li{display:block;color:var(--mu)}
#dlg .gold{width:100%;min-height:50px;font-size:19px}
#dlg .row .gold,#dlg .row .ghost{width:auto}
.shop{display:grid;gap:8px}
.shop button{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;min-height:56px}
.shop svg{width:34px;height:34px}
.shop b{display:block}
.shop small{color:var(--mu);font-size:13px}
.shop em{font-style:normal;font-family:var(--cond);font-weight:700;font-size:18px;color:var(--g1);white-space:nowrap}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:var(--bg);font-family:var(--disp);font-size:28px;color:var(--g1)}
@media(max-width:980px){.mgrid{grid-template-columns:1fr}.side{order:-1;position:static}}
@media(max-width:760px){
 .hud{gap:4px 0;padding:calc(6px + env(safe-area-inset-top)) 8px 6px}
 .brand{flex:1 1 auto;margin:0}.stats{order:3;width:100%;overflow-x:auto;scrollbar-width:none;padding-top:2px}.stats::-webkit-scrollbar{display:none}.stat:first-child{border-left:0;padding-left:2px}.brand svg{width:28px;height:28px}.brand b{font-size:18px}
 .stat{padding:2px 7px}.stat strong{font-size:16px}.stat small{font-size:12px}.bar{width:58px}.stat em{font-size:12.5px}
 .hbtn{width:38px;height:38px}
 .panel{left:0;right:0;bottom:0;top:auto!important;width:auto;height:50vh;border-radius:18px 18px 0 0;border-bottom:0}
 .panel.min{height:auto}.panel.min .pbody{display:none}
 .zoom{bottom:calc(50vh + 10px);left:8px}.panel.min~.zoom{bottom:130px}.maplibregl-ctrl-bottom-left{bottom:50vh;left:58px}
 .pfoot{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}.pfoot .gold{min-height:48px;font-size:18px}
 .pbody h2{font-size:26px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="loading">Carregando a cidade…</div>

<section id="menu" class="hide">
  <svg id="menuMap" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <div class="mgrid">
    <div class="cards" id="cards"></div>
    <div class="side">
      <svg class="emb" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8e09a"/><stop offset=".55" stop-color="#d9a943"/><stop offset="1" stop-color="#a8761f"/></linearGradient></defs>
        <circle cx="60" cy="60" r="54" fill="none" stroke="url(#eg)" stroke-width="4"/><circle cx="60" cy="60" r="46" fill="none" stroke="url(#eg)" stroke-width="1.2" opacity=".6"/>
        <path d="M28 82V62h8v-8h6v28h4V44h10v-8h4v8h10v38h4V56h8v10h8v16z" fill="url(#eg)"/><path d="M26 86h68" stroke="url(#eg)" stroke-width="3"/><path d="M60 20l4 8h-8z" fill="url(#eg)"/></svg>
      <div class="logo">Dono da<br>Cidade</div>
      <p class="slogan">A cidade já tem dono. Escolha um lado, tome território por território e segure a pressão.</p>
      <div class="conts" id="conts"></div>
      <div class="links"><button class="ghost btn" data-g="how">Como jogar</button><button class="ghost btn" data-g="sound" id="sndBtn">Som: ligado</button></div>
      <p class="credit">Obra de ficção. Grupos e personagens são inventados. Mapas: Instituto Pereira Passos/PCRJ e IBGE (Rio), ISTAT CC-BY via openpolis (Sicília).</p>
    </div>
  </div>
</section>

<section id="game" class="hide">
  <div id="map" aria-label="Mapa"></div>
  <header class="hud" id="hud"></header>
  <aside class="panel" id="panel">
    <nav class="tabs" id="tabs"><button data-tab="t" class="on">Território</button><button data-tab="c">Comando</button><button data-tab="p">Plantão</button></nav>
    <div class="pbody" id="pbody"></div>
    <div class="pfoot" id="pfoot"></div>
  </aside>
  <div class="zoom"><button data-z="in" aria-label="Aproximar">+</button><button data-z="out" aria-label="Afastar">−</button><button data-z="home" aria-label="Centralizar na base"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg></button></div>
</section>

<div id="res" role="status"></div>
<div id="dlg" class="hide"><div class="box" id="dlgBox"></div></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'-':'')+'R$ '+Math.abs(Math.round(n)).toLocaleString('pt-BR');
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const sum=a=>a.reduce((x,y)=>x+y,0),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SAVE='ddc2.';
const mob=()=>innerWidth<=760;

// ================= MAPAS =================
const COMUNIDADES=new Set(['Rocinha','Vidigal','Maré','Complexo do Alemão','Jacarezinho','Manguinhos','Cidade de Deus','Costa Barros','Acari','Mangueira','Parque Colúmbia','Vigário Geral','Parada de Lucas','Senador Camará','Gardênia Azul','Barros Filho','Lins de Vasconcelos']);
const PA_CIDADES=new Set(['Bagheria','Monreale','Carini','Partinico','Termini Imerese','Cefalù','Misilmeri','Corleone','Villabate','Caccamo']);
const PA_COSTA=new Set(['Isola delle Femmine','Capaci','Cinisi','Terrasini','Trappeto','Balestrate','Ficarazzi','Santa Flavia','Casteldaccia','Altavilla Milicia','Trabia','Campofelice di Roccella','Lascari','Pollina']);
const ZL={centro:'Centro',sul:'Zona Sul',norte:'Zona Norte',oeste:'Zona Oeste',sudoeste:'Zona Sudoeste'};
const MAPS={},DATA_V='3';
function derive(J,id){
  J.id=id;J.N=J.f.length;J.type=[];J.val=[];J.dm=[];J.tag=[];J.gar=[];
  J.f.forEach(f=>{
    const big=Math.round(Math.min(90,Math.sqrt(f.a)/3));let t,v,d,g,tag;
    if(id==='rio'){
      if(COMUNIDADES.has(f.n)){t='comunidade';v=210;d=1.3;g=[6,9];tag='Comunidade · '+ZL[f.z]}
      else{t=f.z;v={centro:270,sul:320,sudoeste:250,norte:170,oeste:150}[f.z]+big;d={centro:1.15,sul:1.1}[f.z]||1;g=f.z==='sul'||f.z==='centro'?[5,8]:[2,5];tag=ZL[f.z]}
    }else{
      if(f.n==='Palermo'){t='capital';v=720;d=1.45;g=[16,20];tag='Capital da província'}
      else if(PA_CIDADES.has(f.n)){t='cidade';v=260;d=1.15;g=[6,9];tag='Cidade'}
      else if(PA_COSTA.has(f.n)){t='costa';v=200;d=1;g=[4,7];tag='Litoral'}
      else{t='interior';v=120+big;d=1;g=[2,5];tag='Interior'}
    }
    J.type.push(t);J.val.push(v);J.dm.push(d);J.gar.push(g);J.tag.push(tag);
  });
}
async function loadMap(id){
  if(MAPS[id])return MAPS[id];
  const r=await fetch('maps/'+id+'.json?v='+DATA_V);if(!r.ok)throw new Error('mapa');
  const J=await r.json();derive(J,id);MAPS[id]=J;return J;
}

// ================= MODOS =================
const MODES={
  faccao:{name:'Facção',map:'rio',city:'Rio de Janeiro',color:'#e5484d',player:'Tropa do Trilho',
    blurb:'Começa numa comunidade com poucos soldados e um caixa curto. Toma o morro vizinho, depois o asfalto, depois a cidade.',
    feats:['167 bairros reais','Bocas rendem mais','Calor da polícia','3 rivais'],
    startPool:i=>M.type[i]==='comunidade',startTxt:'Escolha a comunidade onde a sua tropa nasce.',
    inc:{comunidade:1.7},unit:'soldados',u1:'soldado',heat:'Calor da polícia',heatAtk:8,
    bribe:'Pagar o arrego',raid:'Operação policial',big:'Ocupação policial',attackVerb:'Invadir',
    recruit:['Bonde novo','10 soldados chegando na base'],
    luck:['A carga chegou inteira','O baile da comunidade bateu recorde','Um fornecedor liberou fiado'],

let G=null,M=null,MD=null,sel=null,tab='t',flashI=null;
const owned=o=>{const a=[];for(let i=0;i<M.N;i++)if(G.d[i].o===o)a.push(i);return a};
const colorOf=o=>o===0?MD.color:o>0?G.f[o-1].color:null;
const oname=o=>o===0?G.pname:o>0?G.f[o-1].name:'Sem dono';
const pTroops=()=>G.reserve+sum(owned(0).map(i=>G.d[i].t));
function pq(){const T=pTroops();if(!T)return 1;const f=Math.min(G.rif,T),p=Math.min(G.pis,T-f);return(1.8*f+1.1*p+.6*(T-f-p))/T}
const qOf=o=>o===0?pq():o>0?G.f[o-1].q:.8;
const defVal=i=>{const d=G.d[i];return Math.max(.5,d.t)*qOf(d.o)*(1+.35*d.f)*M.dm[i]};
const incOf=i=>Math.round(M.val[i]*(MD.inc[M.type[i]]||1)*(MD.budget?.3:1));
const pIncome=()=>sum(owned(0).map(incOf))+(MD.budget||0);
const upkeep=()=>pTroops()*8;
const maxActs=()=>Math.min(6,3+Math.floor(owned(0).length/10));
const reach=i=>G.d[i].o!==0&&M.adj[i].some(j=>G.d[j].o===0);
const bribeCost=()=>400+20*G.heat;
const goal=.5;
const log=(t,c='')=>{G.log.unshift({d:G.day,t,c});if(G.log.length>60)G.log.length=60};
const saveGame=()=>{if(G&&!G.over&&G.phase==='play')store.set(SAVE+G.mode,G)};

function tone(type,freq,dur,vol=.15,slide){if(!sound)return;try{const C=ac(),o=C.createOscillator(),g=C.createGain();o.type=type;o.frequency.value=freq;if(slide)o.frequency.exponentialRampToValueAtTime(slide,C.currentTime+dur);g.gain.setValueAtTime(vol,C.currentTime);g.gain.exponentialRampToValueAtTime(.001,C.currentTime+dur);o.connect(g).connect(C.destination);o.start();o.stop(C.currentTime+dur)}catch(e){}}
function noise(dur,vol,delay){if(!sound)return;try{const C=ac(),b=C.createBuffer(1,Math.floor(C.sampleRate*dur),C.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=C.createBufferSource(),g=C.createGain(),f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;s.buffer=b;g.gain.value=vol;s.connect(f).connect(g).connect(C.destination);s.start(C.currentTime+delay)}catch(e){}}
const sfx={click:()=>tone('triangle',520,.06,.05),cash:()=>{tone('square',988,.08,.05);setTimeout(()=>tone('square',1319,.18,.05),80)},

  lose:()=>tone('sawtooth',300,.4,.07,120),siren:()=>{tone('sine',700,.5,.06,1100);setTimeout(()=>tone('sine',1100,.5,.06,700),480)}};

async function newGame(mode){
  MD=MODES[mode];M=await loadMap(MD.map);
  G={v:2,mode,phase:'setup',pname:MD.player,day:1,money:3000,reserve:15,pis:20,rif:2,heat:10,acts:3,over:null,log:[],base:null,stats:{won:0,lost:0},
     f:MD.rivals.map(r=>({name:r.name,color:r.color,pool:r.pool,money:1800,q:1.1,alive:true})),
     d:M.f.map((_,i)=>({o:-1,t:RI(...M.gar[i]),f:0}))};
  sel=null;tab='t';flashI=null;enterGame();
}
function startAt(i){
  G.phase='play';G.base=i;G.d[i]={o:0,t:10,f:1};
  const starts=[i];
  G.f.forEach((F,k)=>{
    const ok=j=>G.d[j].o===-1&&M.type[j]!=='capital'&&(F.pool==='any'||(F.pool==='comunidade'?M.type[j]==='comunidade':(M.f[j].z==='oeste'||M.f[j].z==='sudoeste')));
    let cand=[...Array(M.N).keys()].filter(ok);if(!cand.length)cand=[...Array(M.N).keys()].filter(j=>G.d[j].o===-1);
    let best=cand[0],bd=-1;
    for(const j of cand){const d=Math.min(...starts.map(s=>Math.hypot(M.f[j].l[0]-M.f[s].l[0],M.f[j].l[1]-M.f[s].l[1])));if(d>bd){bd=d;best=j}}
    starts.push(best);G.d[best]={o:k+1,t:10,f:1};
    M.adj[best].filter(j=>G.d[j].o===-1&&M.type[j]!=='capital').slice(0,2).forEach(j=>G.d[j]={o:k+1,t:5,f:0});
  });
  log(`${G.pname} assumiu ${M.f[i].n}. A disputa por ${MD.city} começou.`,'good');
  sfx.win();sel=i;saveGame();paint();focusOn(i,true);
}

// ================= COMBATE =================
function fight(att,n,i){
  const d=G.d[i],A=n*qOf(att)*R(.85,1.15),D=defVal(i)*R(.85,1.15);
  if(A>D)return{win:true,aLoss:Math.min(n-1,Math.round(n*(D/A)*.6)),dLoss:d.t};
  return{win:false,aLoss:Math.round(n*R(.45,.75)),dLoss:Math.min(d.t,Math.round(d.t*(A/D)*.55))};
}
function loseWeapons(c){const T=pTroops()+c;if(!T||c<=0)return;G.rif=Math.max(0,G.rif-Math.round(c*G.rif/T));G.pis=Math.max(0,G.pis-Math.round(c*G.pis/T))}
function conquer(i,o,surv){
  const prev=G.d[i].o;G.d[i].o=o;G.d[i].t=surv;G.d[i].f=Math.max(0,G.d[i].f-1);
  if(prev>0&&G.f[prev-1].alive&&!owned(prev).length){G.f[prev-1].alive=false;log(`${G.f[prev-1].name} foi varrido do mapa.`,o===0?'good':'')}
}
const odds=r=>r>1.5?['Vitória quase certa','var(--ok)']:r>1.15?['Boa chance','#c6e58f']:r>.9?['Equilibrado','#e9d58a']:r>.6?['Arriscado','#ffa36b']:['Suicídio','var(--bad)'];

// ================= AÇÕES =================
function spend(cost,act){
  if(act&&G.acts<=0){result('Sem ações','Encerre o dia para agir de novo.','bad');return false}
  if(G.money<cost){result('Falta caixa',`Precisa de ${fmt(cost)}.`,'bad');return false}
  G.money-=cost;if(act)G.acts--;return true;
}
const A={
  buy(k){
    const P={sol:[500,()=>{G.reserve+=10;return`+10 ${MD.unit} na base`}],pis:[600,()=>{G.pis+=10;return'+10 pistolas no arsenal'}],rif:[1800,()=>{G.rif+=5;return'+5 fuzis no arsenal'}]}[k];
    if(!P||!spend(P[0],false))return;sfx.cash();result('Comprado',P[1](),'good');
  },
  bribe(){if(G.heat<=0||!spend(bribeCost(),true))return;G.heat=Math.max(0,G.heat-25);sfx.cash();result(MD.bribe,`${MD.heat} caiu para ${G.heat}.`,'good')},
  fort(){const d=G.d[sel];if(d.o!==0||d.f>=2||!spend(800,true))return;d.f++;result('Fortificado',`${M.f[sel].n} agora tem defesa nível ${d.f}.`,'good')},
  dep(n){const d=G.d[sel];n=n==='all'?G.reserve:Math.min(+n,G.reserve);if(n>0){G.reserve-=n;d.t+=n;sfx.click()}},
  wd(n){const d=G.d[sel];n=n==='all'?d.t:Math.min(+n,d.t);if(n>0){d.t-=n;G.reserve+=n;sfx.click()}},
  attack(){
    const n=+(($('#amt')||{}).value||0),i=sel,d=G.d[i];
    if(!n||n>G.reserve||!reach(i))return;
    if(G.acts<=0){result('Sem ações','Encerre o dia para agir de novo.','bad');return}
    const prev=d.o,pn=oname(prev),from=M.adj[i].filter(j=>G.d[j].o===0).sort((a,b)=>G.d[b].t-G.d[a].t)[0];
    G.reserve-=n;G.acts--;
    const r=fight(0,n,i);
    G.heat=Math.min(100,G.heat+(MD.budget?Math.round((r.aLoss+r.dLoss)/2)+3:MD.heatAtk+(M.val[i]>=300?4:0)));
    arrow(from,i);sfx.shots();
    if(r.win){conquer(i,0,n-r.aLoss);G.stats.won++;flashI=i;loseWeapons(r.aLoss);log(`Você tomou ${M.f[i].n} de ${pn}. Perdeu ${r.aLoss}.`,'good');setTimeout(sfx.win,500);result('Vitória',`${M.f[i].n} é seu. Baixas: ${r.aLoss} ${MD.unit}.`,'good')}
    else{G.reserve+=n-r.aLoss;d.t-=r.dLoss;G.stats.lost++;loseWeapons(r.aLoss);log(`Ataque em ${M.f[i].n} falhou. Perdeu ${r.aLoss}, derrubou ${r.dLoss}.`,'bad');setTimeout(sfx.lose,500);result('Recuou',`Perdeu ${r.aLoss} ${MD.unit} e derrubou ${r.dLoss}.`,'bad')}
    checkEnd();
  },
  endDay
};

// ================= DIA, IA E EVENTOS =================
function aiTurn(k,rep){
  const o=k+1,F=G.f[k],mine=owned(o);
  if(!mine.length){F.alive=false;return}
  const T=sum(mine.map(i=>G.d[i].t));
  F.money+=sum(mine.map(i=>M.val[i]))*.75+250-6*T;
  if(F.money>2600&&F.q<1.9&&Math.random()<.45){F.money-=1500;F.q=Math.min(1.9,F.q+.12)}
  const buy=Math.floor(Math.max(0,F.money-400)/60*.5);
  if(buy>0){
    F.money-=buy*60;
    const threat=i=>sum(M.adj[i].filter(j=>G.d[j].o!==o).map(j=>G.d[j].t*qOf(G.d[j].o)))-G.d[i].t*F.q;
    let b=mine.filter(i=>M.adj[i].some(j=>G.d[j].o!==o)).sort((a,c)=>threat(c)-threat(a)).slice(0,3);
    if(!b.length)b=mine;for(let x=0;x<buy;x++)G.d[b[x%b.length]].t++;
  }
  const tries=Math.min(3,1+Math.floor(G.day/6));
  let lead=-1,lc=0;G.f.forEach((f,j)=>{const c=owned(j+1).length;if(c>lc){lc=c;lead=j+1}});if(lead===o||lc<M.N*.15)lead=-2;
  for(let t=0;t<tries;t++){
    let best=null,bs=0;
    for(const a of owned(o)){
      const ta=G.d[a].t;if(ta<3)continue;
      for(const b of M.adj[a]){
        const db=G.d[b];if(db.o===o)continue;
        const def=defVal(b),att=(ta-1)*F.q;if(att<def*1.25)continue;
        const s=M.val[b]/(def+1)*(db.o===0?1.1:1)*(db.o===-1?1.1:1)*(db.o===lead?1.4:1);
        if(s>bs){bs=s;best=[a,b]}
      }
    }
    if(!best)break;
    const[a,b]=best,n=G.d[a].t-1,prev=G.d[b].o;G.d[a].t=1;
    const r=fight(o,n,b);
    if(r.win){conquer(b,o,n-r.aLoss);if(prev===0){flashI=b;loseWeapons(r.dLoss);log(`${F.name} tomou ${M.f[b].n} de você.`,'bad');rep.push(['bad',`${F.name} tomou ${M.f[b].n}`,`-${r.dLoss}`])}else if(prev>0&&Math.random()<.4)log(`${F.name} tomou ${M.f[b].n} de ${G.f[prev-1].name}.`)}
    else{G.d[a].t+=n-r.aLoss;G.d[b].t-=r.dLoss;if(prev===0){loseWeapons(r.dLoss);log(`Você segurou ${M.f[b].n} contra ${F.name}.`,'good');rep.push(['good',`Segurou ${M.f[b].n} contra ${F.name}`,`-${r.dLoss}`])}}
  }
}
function events(rep){
  const mine=owned(0);
  if(Math.random()<G.heat/150&&mine.length){
    const i=mine.reduce((a,b)=>G.d[b].t>G.d[a].t?b:a),l=Math.round(G.d[i].t*R(.3,.55)),m=Math.max(0,Math.round(G.money*.1));
    G.d[i].t-=l;G.money-=m;G.heat=Math.max(0,G.heat-10);loseWeapons(l);sfx.siren();
    log(`${MD.raid} em ${M.f[i].n}: ${l} ${MD.unit} perdidos e ${fmt(m)} apreendidos.`,'bad');rep.push(['bad',`${MD.raid} em ${M.f[i].n}`,`-${l} · -${fmt(m)}`]);
  }
  if(G.heat>=100&&mine.length){
    const i=mine.filter(j=>j!==G.base).sort((a,b)=>incOf(b)-incOf(a))[0];
    if(i!=null){G.d[i]={o:-1,t:RI(6,10),f:0};flashI=i;log(`${MD.big}: você perdeu ${M.f[i].n}.`,'bad');rep.push(['bad',MD.big,`perdeu ${M.f[i].n}`])}
    G.money=Math.round(G.money*.7);G.heat=55;
  }
  if(Math.random()<.45){
    const e=Math.random();
    if(e<.3){const v=RI(6,18)*100,t=pick(MD.luck);G.money+=v;log(`${t}: +${fmt(v)}.`,'good');rep.push(['good',t,'+'+fmt(v)])}
    else if(e<.5){const v=RI(4,8);G.reserve+=v;log(`${MD.join}: +${v} ${MD.unit}.`,'good');rep.push(['good',MD.join,`+${v}`])}
    else if(e<.7){const c=mine.filter(i=>G.d[i].t>=4);if(c.length){const i=pick(c),l=Math.round(G.d[i].t*R(.25,.4));G.d[i].t-=l;loseWeapons(l);log(`${MD.traitor} ${M.f[i].n}: -${l} ${MD.unit}.`,'bad');rep.push(['bad',`${MD.traitor} ${M.f[i].n}`,`-${l}`])}}
    else if(e<.85){G.heat=Math.min(100,G.heat+10);log(`Reportagem na TV sobre ${G.pname}: ${MD.heat.toLowerCase()} +10.`,'bad');rep.push(['bad','Reportagem na TV','+10 de '+MD.heat.toLowerCase()])}
    else{const al=G.f.map((f,k)=>k).filter(k=>G.f[k].alive);if(al.length>1){const a=al[0],b=al[1],c=owned(a+1);if(c.length){const i=pick(c);G.d[i].t=Math.max(1,G.d[i].t-RI(2,5));log(`Confronto entre ${G.f[a].name} e ${G.f[b].name} em ${M.f[i].n}.`)}}}
  }
}
function endDay(){
  const rep=[],inc=pIncome(),up=upkeep();
  G.money+=inc-up;rep.push(['good',MD.budget?'Orçamento e arrecadação':'Arrecadação dos territórios','+'+fmt(inc)],['bad','Salários da tropa','-'+fmt(up)]);
  if(G.money<0){let lost=Math.ceil(G.reserve*.15);G.reserve-=lost;for(const i of owned(0)){const l=Math.ceil(G.d[i].t*.15);G.d[i].t-=l;lost+=l}loseWeapons(lost);log(`Caixa no vermelho: ${lost} ${MD.unit} abandonaram você.`,'bad');rep.push(['bad','Caixa no vermelho: deserção',`-${lost}`])}
  G.f.forEach((F,k)=>{if(F.alive)aiTurn(k,rep)});
  G.heat=Math.max(0,G.heat-5);events(rep);
  G.day++;G.acts=maxActs();
  checkEnd();if(G.over)return;
  saveGame();
  dialog(`<h2>Relatório do dia ${G.day-1}</h2><p class="note">Caixa agora: <b style="color:var(--ink)">${fmt(G.money)}</b> · ${G.acts} ações para o dia ${G.day}</p>
    <ul class="rep">${rep.map(([c,t,v])=>`<li><span>${esc(t)}</span><b style="color:${c==='good'?'var(--ok)':'var(--bad)'}">${esc(v)}</b></li>`).join('')}</ul>
    <button class="gold btn" data-g="close">Começar dia ${G.day}</button>`);
}
function checkEnd(){
  const mine=owned(0).length,share=mine/M.N;
  const top=G.f.map((f,k)=>[k,owned(k+1).length]).sort((a,b)=>b[1]-a[1])[0];let why='';
  if(!mine)G.over='lose';else if(share>=goal||G.f.every(f=>!f.alive))G.over='win';else if(top[1]/M.N>=goal){G.over='lose';why=`${G.f[top[0]].name} virou dono de metade do mapa no dia ${G.day}.`}
  if(!G.over)return;
  store.del(SAVE+G.mode);const win=G.over==='win';win?sfx.win():sfx.lose();
  dialog(`<h2 style="color:${win?'var(--g1)':'var(--bad)'}">${win?'A cidade é sua':'Fim da linha'}</h2>
   <p class="note">${win?`${esc(G.pname)} dominou ${Math.round(share*100)}% de ${esc(MD.city)} em ${G.day} dias.`:(why?esc(why):`${esc(G.pname)} perdeu o último território no dia ${G.day}.`)}</p>
   <ul class="rep"><li><span>Territórios tomados</span><b>${G.stats.won}</b></li><li><span>Ataques fracassados</span><b>${G.stats.lost}</b></li></ul>
   <button class="gold btn" data-g="menu">Voltar ao menu</button>`);
}

function makeBadge(id){
  if(!id.startsWith('bd|')||map.hasImage(id))return;
  const[,col,f,base,s,txt,tc]=id.split('|'),r=2,S=40*r,cv=document.createElement('canvas');cv.width=S;cv.height=S;
  const x=cv.getContext('2d'),c=S/2;
  if(s==='1'){x.beginPath();x.arc(c,c,16*r,0,7);x.fillStyle='rgba(255,255,255,.28)';x.fill()}
  x.beginPath();x.arc(c,c,11*r,0,7);x.fillStyle='#0a0b0e';x.fill();x.lineWidth=2.6*r;x.strokeStyle=col;x.stroke();
  x.fillStyle='#f8e09a';
  for(let k=0;k<+f;k++){x.beginPath();x.roundRect?x.roundRect(c+8*r+k*6*r,c-15*r,5*r,7*r,1.5*r):x.rect(c+8*r+k*6*r,c-15*r,5*r,7*r);x.fill()}
  if(base==='1'){x.beginPath();x.moveTo(c-7*r,c-12*r);x.lineTo(c,c-19*r);x.lineTo(c+7*r,c-12*r);x.closePath();x.fill()}
  x.fillStyle=tc||'#fff';x.textAlign='center';x.textBaseline='middle';x.font=`700 ${(txt.length>2?11:13)*r}px 'Barlow Condensed',Barlow,Arial,sans-serif`;x.fillText(txt,c,c+.5*r);
  map.addImage(id,{width:S,height:S,data:x.getImageData(0,0,S,S).data},{pixelRatio:r});
}

    else{c=o===-1?'#101216':colorOf(o);a=o===-1?.3:o===0?.62:.48;if(reach(i))front.push(i)}

 <li>Escolha a sua base no mapa real e expanda para os vizinhos.</li>
 <li>Cada dia tem poucas ações. Atacar, fortificar e baixar a pressão gastam uma ação. Comprar tropa e armas e mover tropa só custa dinheiro.</li>
 <li>O ataque sai da tropa livre na base. Toque num alvo tracejado, escolha quantos vão e veja a chance.</li>
 <li>Armas pesam: sem arma vale 0,6, pistola 1,1 e fuzil 1,8. Quem cai leva a arma junto.</li>
 <li>Cada território rende por dia e cada membro custa salário. Sem caixa, a tropa deserta.</li>
 <li>Ataques sobem a pressão. Pressão alta traz operação e, em 100, você perde território.</li>
 <li>Vence quem dominar metade do mapa ou eliminar todos os rivais.</li></ul><button class="gold btn" data-g="close">Entendi</button>`;

// ================= EVENTOS DE INTERFACE =================
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-g]');
  if(g){const v=g.dataset.g;
    if(v==='menu'){toMenu();return}if(v==='close'){closeDlg();return}if(v==='how'){dialog(HOW);return}
    if(v==='new'){$('#cards').scrollIntoView({behavior:'smooth'});return}
    if(v==='sound'){sound=!sound;store.set('ddc2.sound',sound);if(G&&!$('#game').classList.contains('hide'))renderHUD();$('#sndBtn').textContent='Som: '+(sound?'ligado':'desligado');return}}
  const n=e.target.closest('[data-new]');if(n){const k=n.dataset.new,s=store.get(SAVE+k);if(s){dialog(`<h2>Começar de novo?</h2><p class="note">A partida de ${MODES[k].name} no dia ${s.day} será apagada.</p><div class="row"><button class="ghost btn" data-g="close">Cancelar</button><button class="gold btn" data-confirm="${k}">Começar nova</button></div>`);return}newGame(k);return}
  const cf=e.target.closest('[data-confirm]');if(cf){store.del(SAVE+cf.dataset.confirm);newGame(cf.dataset.confirm);return}
  const c=e.target.closest('[data-cont]');if(c){resume(c.dataset.cont);return}
  const t=e.target.closest('[data-tab]');if(t){const p=$('#panel');if(mob()&&t.dataset.tab===tab&&!p.classList.contains('min')){p.classList.add('min')}else{p.classList.remove('min');tab=t.dataset.tab;renderPanel()}sfx.click();return}
  const s=e.target.closest('[data-sel]');if(s){sel=+s.dataset.sel;focusOn(sel,true);paint();return}
  const z=e.target.closest('[data-z]');if(z&&map){if(z.dataset.z==='in')map.zoomIn();else if(z.dataset.z==='out')map.zoomOut();else if(G.base!=null)focusOn(G.base,true);else fitAll();return}
  const a=e.target.closest('[data-a]');if(!a||a.disabled||!G||G.over)return;
  if(a.dataset.a==='start'){if(sel!=null&&MD.startPool(sel))startAt(sel);return}
  A[a.dataset.a](a.dataset.n);paint();if(!G.over)saveGame();
});
$('#pbody').addEventListener('input',e=>{if(e.target.id==='amt')updOdds()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeDlg()});

(async()=>{
  try{await loadMap('rio')}catch(e){}
  $('#loading').remove();$('#menu').classList.remove('hide');renderMenu();
})();
}
</script>
